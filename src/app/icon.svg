<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The same mark the header draws in CSS (see LogoMark): four slots on a jade
       tile, two of them taken. Kept in step with it by hand — a 32px favicon is
       not worth rendering a component into an image for. -->
  <defs>
    <linearGradient id="jade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17a67c" />
      <stop offset="1" stop-color="#0e8a66" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="9" fill="url(#jade)" />
  <rect x="8" y="8" width="7" height="7" rx="1.5" fill="#ffffff" fill-opacity="0.95" />
  <rect x="17" y="8" width="7" height="7" rx="1.5" fill="#ffffff" fill-opacity="0.55" />
  <rect x="8" y="17" width="7" height="7" rx="1.5" fill="#ffffff" fill-opacity="0.55" />
  <rect x="17" y="17" width="7" height="7" rx="1.5" fill="#ffffff" fill-opacity="0.95" />
</svg>
